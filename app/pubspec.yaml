name: app_riceguardianai
description: "RiceGuardian AI — App di động dành cho Nông dân"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  go_router: ^14.6.2
  provider: ^6.1.2
  camera: ^0.11.0+2
  image_picker: ^1.1.2
  flutter_image_compress: ^2.3.0
  geolocator: ^13.0.2
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  intl: ^0.19.0
  connectivity_plus: ^6.1.1
  path_provider: ^2.1.5
  http: ^1.2.2
  shared_preferences: ^2.5.5
  tflite_flutter: ^0.11.0
  image: ^4.5.4
  google_fonts: ^6.2.1
  google_sign_in: ^6.2.2
  mqtt_client: ^10.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.3
  flutter_native_splash: ^2.4.4
  path_provider_platform_interface: ^2.1.2
  plugin_platform_interface: ^2.1.8

flutter:
  uses-material-design: true
  assets:
    - assets/models/
    - assets/disease_catalog.json
    - assets/news/
    - img/logo_riceguardianai.png
    - img/logo_launcher_white.png
    - img/monitoring_station.png
    - img/login_background.jpg

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "img/logo_launcher_white.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "img/logo_launcher_foreground.png"
  min_sdk_android: 26

flutter_native_splash:
  color: "#FFFFFF"
  # Logo + title stacked (title sits under logo, not screen bottom).
  image: img/splash_with_title.png
  android_12:
    color: "#FFFFFF"
    icon_background_color: "#FFFFFF"
    image: img/splash_android12.png
